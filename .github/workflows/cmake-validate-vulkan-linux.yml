name: Vulkan Validation (Ubuntu GCC)
permissions:
  contents: read
  
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc]
        build_type: [Debug]  # coverage should be done in Debug builds
        include:
          - compiler: gcc
            c: gcc
            cxx: g++

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Vulkan Mesa Drivers
        run: sudo apt install mesa-vulkan-drivers libvulkan1
        
      - name: Download and extract Vulkan SDK
        env:
          VULKAN_SDK_VERSION: 1.4.321.1
        run: |
          curl -LO https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/linux/vulkan-sdk-linux-x86_64-${VULKAN_SDK_VERSION}.tar.xz
          tar -xf vulkan-sdk-linux-x86_64-${VULKAN_SDK_VERSION}.tar.xz -C $HOME
          
          SDK_PATH="$HOME/${VULKAN_SDK_VERSION}/x86_64"
          
          echo "VULKAN_SDK=${SDK_PATH}" >> $GITHUB_ENV
          echo "PATH=${SDK_PATH}/bin:$PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=${SDK_PATH}/lib:${SDK_PATH}/lib64:$LD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "VK_LAYER_PATH=${SDK_PATH}/etc/vulkan/explicit_layer.d" >> $GITHUB_ENV

      - name: Verify Vulkan setup
        run: |
          echo "VULKAN_SDK=$VULKAN_SDK"
          vulkaninfo | grep VK_LAYER_KHRONOS_validation || echo "Validation layer not found!"

          
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            lcov \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libxkbcommon-dev 
        
      - name: Configure CMake (Linux + Coverage)
        run: >
          cmake -B build
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          -DCMAKE_C_COMPILER=${{ matrix.c }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DPYRO_COMMON_BUILD_TESTS=OFF
          -DPYRO_COMMON_SHARED_LIBRARY=OFF
          -DPYRO_RHI_BUILD_TESTS=ON
          -DPYRO_RHI_BUILD_VULKAN=ON
          -DPYRO_RHI_BUILD_VULKAN_VALIDATION_TESTS=ON
          -DPYRO_RHI_BUILD_DX12=OFF
          -DPYRO_RHI_BUILD_METAL=OFF
          -DPYRO_RHI_ENABLE_CODE_COVERAGE=ON
          -S .

      - name: Build (Linux)
        run: cmake --build build --config ${{ matrix.build_type }} --parallel 4

      - name: Run API validation tests
        working-directory: build
        run: ctest --output-on-failure --rerun-failed 

      - name: Coverage Sanity Check & Generate lcov Info
        run: |
          echo "=== Checking for .gcda coverage files ==="
          # Find all .gcda files recursively
          GCDA_FILES=$(find build -name '*.gcda')
          if [ -z "$GCDA_FILES" ]; then
              echo "❌ No .gcda files found! Coverage instrumentation may be missing or tests didn't run."
              exit 1
          else
              echo "✅ Found the following .gcda files:"
              echo "$GCDA_FILES"
          fi

          # Capture coverage from the build directory recursively
          lcov --directory build --capture --output-file coverage.info --include "RHIVulkan/*" 

          # Show coverage summary
          lcov --summary coverage.info

      - name: Generate HTML Report
        run: genhtml coverage.info --output-directory coverage_html

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vulkan-Coverage-Report
          path: coverage_html

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.info
          flags: vulkan
          fail_ci_if_error: true
