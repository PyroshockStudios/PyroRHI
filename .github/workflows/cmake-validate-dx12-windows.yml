name: DirectX 12 Validation (Windows ClangCL)
permissions:
  contents: read

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-windows-coverage:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug]

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ensure LLVM tools (llvm-profdata / llvm-cov) are available
        shell: pwsh
        run: |
          choco install llvm -y --no-progress
          # ensure choco path is available
          $env:Path += ";C:\Program Files\LLVM\bin"
          llvm-profdata --version
          llvm-cov --version

      - name: Configure CMake (Clang-CL + Coverage)
        shell: pwsh
        env:
          # Optional: force Visual Studio generator - you can pick the generator you want
          # Adjust generator if needed, e.g. "Visual Studio 17 2022"
          #CMAKE_GENERATOR: "Visual Studio 17 2022"
        run: |
          cmake -B build `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DPYRO_COMMON_BUILD_TESTS=OFF `
            -DPYRO_COMMON_SHARED_LIBRARY=OFF `
            -DPYRO_RHI_BUILD_VULKAN=OFF `
            -DPYRO_RHI_BUILD_DX12=ON `
            -DPYRO_RHI_BUILD_DX12_VALIDATION_TESTS=ON `
            -DPYRO_RHI_BUILD_METAL=OFF `
            -DPYRO_RHI_ENABLE_CODE_COVERAGE=ON `
            -S .

      - name: Build (Clang-CL)
        shell: pwsh
        run: cmake --build build --config ${{ matrix.build_type }} --parallel 4

      - name: Run API validation tests (generate .profraw)
        shell: pwsh
        working-directory: build
        run: |
          # Make sure LLVM_PROFILE_FILE will output profraw files into the build dir.
          # %p is replaced by pid for each process; adjust pattern if you want multiple files per test.
          $env:LLVM_PROFILE_FILE = "$(pwd)\%p.profraw"

          Write-Host "LLVM_PROFILE_FILE = $env:LLVM_PROFILE_FILE"
          # Run tests (ctest will run the instrumented exe). Ensure tests spawn processes that inherit environment.
          ctest --config ${{ matrix.build_type }} --output-on-failure --rerun-failed

      - name: Find .profraw files
        shell: pwsh
        working-directory: build
        run: |
          $profraw = Get-ChildItem -Path . -Recurse -Filter *.profraw -ErrorAction SilentlyContinue
          if (-not $profraw) {
              Write-Error "No .profraw files found. Coverage instrumentation may be missing or tests didn't run."
              Exit 1
          }
          Write-Host "Found profraw files:"
          $profraw | ForEach-Object { Write-Host $_.FullName }

      - name: Merge .profraw -> coverage.profdata
        shell: pwsh
        working-directory: build
        run: |
          # gather file list
          $files = Get-ChildItem -Path . -Recurse -Filter *.profraw | ForEach-Object { $_.FullName }
          if ($files.Count -eq 0) { Write-Error "No profraw files to merge"; Exit 1 }

          # merge (sparse) into one profdata
          llvm-profdata merge -sparse $files -o coverage.profdata
          Write-Host "Merged into: $(Get-Item coverage.profdata).FullName"

      - name: Generate lcov-format report (llvm-cov -> lcov)
        shell: pwsh
        working-directory: build
        run: |
          # Path to the test executable that was instrumented. Update if different.
          $exe = "bin\Debug\RHIValidationTestDX12.exe"
          if (-not (Test-Path $exe)) {
              Write-Error "Test executable not found at build\$exe. Update workflow EXE path to match actual output."
              Exit 1
          }

          # Output lcov format
          llvm-cov show $exe -instr-profile=coverage.profdata -format=lcov -output-file=coverage.info
          Write-Host "Generated coverage.info"

          # Quick summary via llvm-cov report (text) - also useful for logs
          llvm-cov report $exe -instr-profile=coverage.profdata

      - name: Generate HTML Report (llvm-cov)
        shell: pwsh
        working-directory: build
        run: |
          $exe = "bin\Debug\RHIValidationTestDX12.exe"
          llvm-cov show $exe -instr-profile=coverage.profdata -format=html -output-dir coverage_html
          Write-Host "HTML coverage at build\coverage_html"

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DX12-Coverage-Report
          path: build/coverage_html

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/coverage.info
          flags: dx12
          fail_ci_if_error: true
