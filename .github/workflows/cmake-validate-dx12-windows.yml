name: DirectX 12 Validation (Windows ClangCL)
permissions:
  contents: read

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-windows-coverage:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug]

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Ensure LLVM (clang-cl) and Ninja present
        shell: pwsh
        run: |
          choco install llvm -y --no-progress
          choco install ninja -y --no-progress
          # put LLVM on PATH for this step
          $llvmBin = 'C:\Program Files\LLVM\bin'
          if (Test-Path $llvmBin) {
            $env:Path = "$env:Path;$llvmBin"
          }
          clang-cl --version
          ninja --version
      
      - name: Configure CMake (Ninja + clang-cl + coverage)
        shell: pwsh
        run: |
          # Use Ninja generator so clang-cl is invoked directly (not via MSBuild/cl.exe)
          cmake -G "Ninja" -B build -S . `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DPYRO_COMMON_BUILD_TESTS=OFF `
            -DPYRO_COMMON_SHARED_LIBRARY=OFF `
            -DPYRO_RHI_BUILD_VULKAN=OFF `
            -DPYRO_RHI_BUILD_DX12=ON `
            -DPYRO_RHI_BUILD_DX12_VALIDATION_TESTS=ON `
            -DPYRO_RHI_BUILD_METAL=OFF `
            -DPYRO_RHI_ENABLE_CODE_COVERAGE=ON

      - name: Build (Ninja)
        shell: pwsh
        run: cmake --build build --parallel 4

      - name: Run API validation tests (generate .profraw)
        shell: pwsh
        working-directory: build
        run: |
          # Emit profraw files per-process into the build directory (pid suffix)
          $buildDir = (Get-Location).Path
          $env:LLVM_PROFILE_FILE = "$buildDir\\%p.profraw"
          Write-Host "LLVM_PROFILE_FILE = $env:LLVM_PROFILE_FILE"

          # Run tests. ctest will launch the instrumented binaries which produce .profraw files.
          ctest --build-config ${{ matrix.build_type }} --output-on-failure --rerun-failed

      - name: Find .profraw files
        shell: pwsh
        working-directory: build
        run: |
          $profraw = Get-ChildItem -Path . -Recurse -Filter '*.profraw' -ErrorAction SilentlyContinue
          if (-not $profraw) {
            Write-Error "No .profraw files found. Coverage instrumentation may be missing or tests didn't run."
            Exit 1
          }
          Write-Host "Found profraw files:"
          $profraw | ForEach-Object { Write-Host $_.FullName }

      - name: Merge .profraw -> coverage.profdata
        shell: pwsh
        working-directory: build
        run: |
          $files = Get-ChildItem -Path . -Recurse -Filter '*.profraw' | ForEach-Object { $_.FullName }
          if ($files.Count -eq 0) { Write-Error "No profraw files to merge"; Exit 1 }
          # llvm-profdata supports multiple files; pass them directly
          llvm-profdata merge -sparse $files -o coverage.profdata
          Write-Host "Merged into coverage.profdata"

      - name: Generate lcov-format report (llvm-cov -> lcov)
        shell: pwsh
        working-directory: build
        run: |
          # Update EXE_PATH to the actual instrumented test binary produced by your build
          $exePath = "bin\Debug\RHIValidationTestDX12.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "Test executable not found at build\$exePath. Update workflow EXE path to match actual output."
            Exit 1
          }

          # Produce lcov-style coverage.info
          llvm-cov show $exePath -instr-profile=coverage.profdata -format=lcov -output-file=coverage.info
          Write-Host "Generated coverage.info"

          # Print a short text summary for the logs
          llvm-cov report $exePath -instr-profile=coverage.profdata

      - name: Generate HTML Report
        shell: pwsh
        working-directory: build
        run: |
          $exePath = "bin\Debug\RHIValidationTestDX12.exe"
          llvm-cov show $exePath -instr-profile=coverage.profdata -format=html -output-dir coverage_html
          Write-Host "HTML coverage at build/coverage_html"

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DX12-Coverage-Report
          path: build/coverage_html

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/coverage.info
          flags: dx12
          fail_ci_if_error: true
