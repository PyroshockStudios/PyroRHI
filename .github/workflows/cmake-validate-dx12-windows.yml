name: DirectX 12 Validation (Windows ClangCL)
permissions:
  contents: read

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-windows-coverage:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug]

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Ensure LLVM (clang-cl) and Ninja present
        shell: pwsh
        run: |
          choco install llvm -y --no-progress
          choco install ninja -y --no-progress
          # put LLVM on PATH for this step
          $llvmBin = 'C:\Program Files\LLVM\bin'
          if (Test-Path $llvmBin) {
            $env:Path = "$env:Path;$llvmBin"
          }
          clang-cl --version
          ninja --version
      
      - name: Configure CMake (Ninja + clang-cl + coverage)
        shell: pwsh
        run: |
          # Use Ninja generator so clang-cl is invoked directly (not via MSBuild/cl.exe)
          cmake -G "Ninja" -B build -S . `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_BUILD_TYPE=Debug `
            -DPYRO_COMMON_BUILD_TESTS=OFF `
            -DPYRO_COMMON_SHARED_LIBRARY=OFF `
            -DPYRO_RHI_BUILD_TESTS=ON `
            -DPYRO_RHI_BUILD_VULKAN=OFF `
            -DPYRO_RHI_BUILD_DX12=ON `
            -DPYRO_RHI_BUILD_DX12_VALIDATION_TESTS=ON `
            -DPYRO_RHI_BUILD_METAL=OFF `
            -DPYRO_RHI_ENABLE_CODE_COVERAGE=ON
        
      - name: Build (Ninja)
        shell: pwsh
        run: |
          cmake --build build --parallel 16
          
      - name: Run Tests and Generate Coverage
        shell: pwsh
        run: |
          # Set the build directory (assuming 'build' is in the current location)
          $buildDir = (Join-Path $env:GITHUB_WORKSPACE "build")
          $env:LLVM_PROFILE_FILE = "$buildDir\%p.profraw"
          Write-Host "LLVM_PROFILE_FILE = $env:LLVM_PROFILE_FILE"

          # Run tests
          Push-Location $buildDir
          ctest --build-config Debug --output-on-failure --rerun-failed
          $ctestExitCode = $LASTEXITCODE
          Pop-Location

          if ($ctestExitCode -ne 0) {
              Write-Host "ctest returned non-zero exit code ($ctestExitCode) — tests may have failed. Continuing..."
          }

          # --- 1. Merge .profraw files ---
          $profraw = Get-ChildItem -Path $buildDir -Recurse -Filter '*.profraw' -File -ErrorAction SilentlyContinue
          if (-not $profraw -or $profraw.Count -eq 0) {
              Write-Error "No .profraw files found. Coverage instrumentation may be missing or tests didn't run."
              Exit 1
          }
          Write-Host "Found profraw files:"
          $profraw | ForEach-Object { Write-Host "  $($_.FullName)" }

          $profrawFiles = $profraw | ForEach-Object { $_.FullName }
          $profdataCmd = "llvm-profdata.exe" # Assumes llvm-profdata is in PATH
          $profdataOut = Join-Path $buildDir "coverage.profdata"
          $profrawListFile = Join-Path $buildDir "profraw_files.list.txt"

          # Write all profraw files to a response file to avoid "filename too long" error
          $profrawFiles | Set-Content -Path $profrawListFile -Encoding Ascii

          Write-Host "Merging profraw files using response file -> $profdataOut"
          # Use -f to read the list from the file, bypassing command line length limits
          & $profdataCmd merge -sparse -f $profrawListFile -o $profdataOut
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $profdataOut)) {
              Write-Error "llvm-profdata merge failed."
              Exit 1
          }

          # --- 2. Define Binaries and Generate Reports ---
          $llvmCovCmd = "llvm-cov.exe" # Assumes llvm-cov is in PATH
          $profdata = $profdataOut

          # We MUST include all binaries:
          # - The .dll files (like RHIDX12.dll) contain the library code being tested.
          # - The .exe files (like RHIValidationTestDX12.exe) contain the tests AND the executed copies of inline header functions.
          $allBins = Get-ChildItem -Path $buildDir -Recurse -Include 'RHIBaseTest.exe','RHIValidationTestDX12.exe','RHIDX12.dll' -File | Select-Object -ExpandProperty FullName
          $testBins = Get-ChildItem -Path $buildDir -Recurse -Include 'RHIBaseTest.exe','RHIValidationTestDX12.exe' -File | Select-Object -ExpandProperty FullName

          if ($allBins.Count -eq 0) {
              Write-Error "No instrumented binaries found (.dll or .exe)."
              Exit 1
          }
          if ($testBins.Count -eq 0) {
              Write-Error "No instrumented test binaries found (.exe)."
              Exit 1
          }

          # --- 3. Generate LCOV Report (from ALL binaries) ---
          $coverageInfoAll = Join-Path $buildDir "coverage.all.info"
          Write-Host "Generating LCOV coverage from all binaries -> $coverageInfoAll"

          & $llvmCovCmd export ("-instr-profile=$profdata") ("-format=lcov") @allBins > $coverageInfoAll
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $coverageInfoAll)) {
              Write-Error "llvm-cov export failed for all binaries."
              # We won't try to fall back here as the merge logic depends on this file
              Exit 1
          } else {
              Write-Host "Generated LCOV-format coverage.all.info"
          }

          # --- 3.5 Generate LCOV Report (from TEST binaries only) ---
          $coverageInfoTests = Join-Path $buildDir "coverage.tests.info"
          Write-Host "Generating LCOV coverage from test binaries -> $coverageInfoTests"

          & $llvmCovCmd export ("-instr-profile=$profdata") ("-format=lcov") @testBins > $coverageInfoTests
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $coverageInfoTests)) {
              Write-Error "llvm-cov export failed for test binaries."
              Exit 1
          } else {
              Write-Host "Generated LCOV-format coverage.tests.info"
          }


          # --- 4. Print Text Summary (from ALL binaries) ---
          Write-Host "Generating text summary from all binaries (Note: header coverage may appear low here):"
          & $llvmCovCmd report @allBins ("-instr-profile=$profdata") | ForEach-Object { Write-Host $_ }

          # --- 5. Generate HTML Report (from ALL binaries) ---
          $htmlDir = Join-Path $buildDir "coverage_html"
          Write-Host "Generating HTML report from all binaries -> $htmlDir (Note: header coverage may appear low here)"
          if (Test-Path $htmlDir) {
              Remove-Item $htmlDir -Recurse -Force
          }
          & $llvmCovCmd show @allBins ("-instr-profile=$profdata") ("-format=html") ("-output-dir=$htmlDir")
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $htmlDir)) {
              Write-Error "llvm-cov html generation failed."
              Exit 1
          }
          Write-Host "HTML coverage generated at $htmlDir"

          # --- 6. Merge and Filter LCOV Reports ---
          $out = Join-Path $buildDir "coverage_rhidx12.info"
          $mergedRecords = @{}

          # Helper function to parse LCOV records and add to a map
          function Parse-LcovRecords($filePath, $map) {
              $lines = Get-Content $filePath -Raw -ErrorAction Stop
              $records = $lines -split "(?<=\r?\n)end_of_record\r?\n"
              foreach ($rec in $records) {
                  if ($rec.Trim() -eq "") { continue }
                  $sfLine = $rec -split "\r?\n" | Select-String -Pattern "^SF:"
                  if ($sfLine) {
                      $fileName = $sfLine.ToString().Substring(3) # Get path after "SF:"
                      if (-not $rec.TrimEnd().EndsWith("end_of_record")) {
                           $rec = $rec.TrimEnd() + "`nend_of_record`n" 
                      }
                      # Add or Overwrite the record in the map
                      $map[$fileName] = $rec
                  }
              }
          }

          Write-Host "Merging LCOV files..."
          # Add all records from the library report first
          Parse-LcovRecords -filePath $coverageInfoAll -map $mergedRecords
          # Add/overwrite with records from the test report (for headers)
          Parse-LcovRecords -filePath $coverageInfoTests -map $mergedRecords
          Write-Host "Merge complete. Filtering..."

          $kept = @()
          foreach ($rec in $mergedRecords.Values) {
              # Match paths containing RHIDX12 or PyroRHI (for your headers)
              if ($rec -match "SF:.*(RHIDX12|PyroRHI)") {
                  $kept += $rec
              }
          }

          if ($kept.Count -eq 0) {
              Write-Error "No RHIDX12 or PyroRHI records found in merged coverage.info. Nothing to output."
              # Don't exit, just warn, as the main report might still be useful
              Write-Warning "The filtered file $out will be empty."
          } else {
              $kept -join "" | Set-Content -Encoding Ascii $out
              Write-Host "Generated filtered LCOV -> $out (records: $($kept.Count))"
          }

          Write-Host "---"
          Write-Host "Coverage generation complete."
          Write-Host "NOTE: HTML/Text reports show 'averaged' header coverage."
          Write-Host "The merged (high-coverage) header report is in '$out'."
          Write-Host "---"
          
      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DX12-Coverage-Report
          path: build/coverage_html
          
      - name: Upload LCOV File
        uses: actions/upload-artifact@v4
        with:
          name: DX12-LCOV-Data
          path: build/coverage_rhidx12.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/coverage_rhidx12.info
          flags: dx12
          fail_ci_if_error: true
          verbose: true
