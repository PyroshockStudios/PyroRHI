name: DirectX 12 Validation (Windows ClangCL)
permissions:
  contents: read

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-windows-coverage:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug]

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake (Clang-CL + Coverage)
        shell: pwsh
        run: |
          cmake -B build `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DPYRO_COMMON_BUILD_TESTS=OFF `
            -DPYRO_COMMON_SHARED_LIBRARY=OFF `
            -DPYRO_RHI_BUILD_VULKAN=OFF `
            -DPYRO_RHI_BUILD_DX12=ON `
            -DPYRO_RHI_BUILD_DX12_VALIDATION_TESTS=ON `
            -DPYRO_RHI_BUILD_METAL=OFF `
            -DPYRO_RHI_ENABLE_CODE_COVERAGE=ON `
            -S .

      - name: Build (Clang-CL)
        shell: pwsh
        run: cmake --build build --config ${{ matrix.build_type }} --parallel 4

      - name: Run API validation tests
        shell: pwsh
        working-directory: build
        run: ctest --output-on-failure --rerun-failed

      - name: Generate Coverage Report (LLVM)
        shell: pwsh
        run: |
          $llvmProfdata = "C:\Program Files\LLVM\bin\llvm-profdata.exe"
          $llvmCov = "C:\Program Files\LLVM\bin\llvm-cov.exe"

          # Merge raw profiles from test run
          & $llvmProfdata merge -sparse build\*.profraw -o coverage.profdata

          # Generate lcov-style report
          & $llvmCov show build\bin\Debug\RHIValidationTestDX12.exe `
            -instr-profile=coverage.profdata `
            -format=lcov `
            -output-file=coverage.info

      - name: Generate HTML Report
        shell: pwsh
        run: |
          $llvmCov = "C:\Program Files\LLVM\bin\llvm-cov.exe"
          & $llvmCov show build\bin\Debug\RHIValidationTestDX12.exe `
            -instr-profile=coverage.profdata `
            -format=html `
            -output-dir coverage_html

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DX12-Coverage-Report
          path: coverage_html

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.info
          flags: dx12
          fail_ci_if_error: true
