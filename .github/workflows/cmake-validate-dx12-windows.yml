name: DirectX 12 Validation (Windows ClangCL)
permissions:
  contents: read

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-windows-coverage:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug]

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Ensure LLVM (clang-cl) and Ninja present
        shell: pwsh
        run: |
          choco install llvm -y --no-progress
          choco install ninja -y --no-progress
          # put LLVM on PATH for this step
          $llvmBin = 'C:\Program Files\LLVM\bin'
          if (Test-Path $llvmBin) {
            $env:Path = "$env:Path;$llvmBin"
          }
          clang-cl --version
          ninja --version
      
      - name: Configure CMake (Ninja + clang-cl + coverage)
        shell: pwsh
        run: |
          # Use Ninja generator so clang-cl is invoked directly (not via MSBuild/cl.exe)
          cmake -G "Ninja" -B build -S . `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DPYRO_COMMON_BUILD_TESTS=OFF `
            -DPYRO_COMMON_SHARED_LIBRARY=OFF `
            -DPYRO_RHI_BUILD_VULKAN=OFF `
            -DPYRO_RHI_BUILD_DX12=ON `
            -DPYRO_RHI_BUILD_DX12_VALIDATION_TESTS=ON `
            -DPYRO_RHI_BUILD_METAL=OFF `
            -DPYRO_RHI_ENABLE_CODE_COVERAGE=ON

      - name: Build (Ninja)
        shell: pwsh
        run: cmake --build build --parallel 4

      - name: Run API validation tests (generate .profraw)
        shell: pwsh
        working-directory: build
        run: |
          # Emit profraw files per-process into the build directory (pid suffix)
          $buildDir = (Get-Location).Path
          $env:LLVM_PROFILE_FILE = "$buildDir\\%p.profraw"
          Write-Host "LLVM_PROFILE_FILE = $env:LLVM_PROFILE_FILE"
      
          # Run tests. ctest will launch the instrumented binaries which produce .profraw files.
          ctest --build-config ${{ matrix.build_type }} --output-on-failure --rerun-failed
          if ($LASTEXITCODE -ne 0) {
            Write-Host "ctest returned non-zero exit code ($LASTEXITCODE) — tests may have failed. Continuing to gather any .profraw files produced."
          }
      
      - name: Find .profraw files
        shell: pwsh
        working-directory: build
        run: |
          $profraw = Get-ChildItem -Path . -Recurse -Filter '*.profraw' -File -ErrorAction SilentlyContinue
          if (-not $profraw -or $profraw.Count -eq 0) {
            Write-Error "No .profraw files found. Coverage instrumentation may be missing or tests didn't run."
            Exit 1
          }
          Write-Host "Found profraw files:"
          $profraw | ForEach-Object { Write-Host "  $($_.FullName)" }
      
      - name: Merge .profraw -> coverage.profdata
        shell: pwsh
        working-directory: build
        run: |
          $files = @(Get-ChildItem -Path . -Recurse -Filter '*.profraw' -File | ForEach-Object { $_.FullName })
          if ($files.Count -eq 0) { Write-Error "No profraw files to merge"; Exit 1 }
      
          # Find llvm-profdata
          $profdataCmd = (Get-Command llvm-profdata.exe -ErrorAction SilentlyContinue).Path
          if (-not $profdataCmd) { $profdataCmd = (Get-Command llvm-profdata -ErrorAction SilentlyContinue).Path }
          if (-not $profdataCmd) {
            # try common installation location (Chocolatey / LLVM installer)
            $maybe = "C:\Program Files\LLVM\bin\llvm-profdata.exe"
            if (Test-Path $maybe) { $profdataCmd = $maybe }
          }
          if (-not $profdataCmd) { Write-Error "llvm-profdata not found in PATH. Install LLVM or ensure llvm-profdata is on PATH."; Exit 1 }
      
          Write-Host "Using llvm-profdata: $profdataCmd"
          $profdataOut = Join-Path (Get-Location) "coverage.profdata"
          # merge with -sparse; expand $files as arguments
          & $profdataCmd merge -sparse $files -o $profdataOut
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $profdataOut)) {
            Write-Error "llvm-profdata merge failed or coverage.profdata not produced."
            Exit 1
          }
          Write-Host "Merged -> $profdataOut"
      
      - name: Generate lcov-format report (llvm-cov -> lcov) and HTML
        shell: pwsh
        working-directory: build
        run: |
          # locate llvm-cov
          $llvmCovCmd = (Get-Command llvm-cov.exe -ErrorAction SilentlyContinue).Path
          if (-not $llvmCovCmd) { $llvmCovCmd = (Get-Command llvm-cov -ErrorAction SilentlyContinue).Path }
          if (-not $llvmCovCmd) {
            $maybe = "C:\Program Files\LLVM\bin\llvm-cov.exe"
            if (Test-Path $maybe) { $llvmCovCmd = $maybe }
          }
          if (-not $llvmCovCmd) { Write-Error "llvm-cov not found in PATH. Install LLVM or ensure llvm-cov is on PATH."; Exit 1 }
          Write-Host "Using llvm-cov: $llvmCovCmd"
        
          $profdata = Join-Path (Get-Location) "coverage.profdata"
          if (-not (Test-Path $profdata)) { Write-Error "Merged profile ($profdata) not found"; Exit 1 }
        
          # Try hard-coded exe path first, else search for the test executable
          $exeRel = "bin\Debug\RHIValidationTestDX12.exe"
          $exePath = Join-Path (Get-Location) $exeRel
          if (-not (Test-Path $exePath)) {
            Write-Host "Executable not found at $exeRel. Searching for instrumented test exe by name..."
            $found = Get-ChildItem -Path . -Recurse -Include 'RHIValidationTestDX12.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $exePath = $found.FullName; Write-Host "Found exe: $exePath" }
          } else {
            Write-Host "Using exe: $exePath"
          }
          if (-not (Test-Path $exePath)) {
            Write-Error "Test executable not found. Update \$exeRel in the workflow to the correct path or ensure tests produced an instrumented exe."
            Write-Host "Listing some .exe files for debugging:"
            Get-ChildItem -Path . -Recurse -Include '*.exe' -File | Select-Object -First 50 | ForEach-Object { Write-Host "  $($_.FullName)" }
            Exit 1
          }
        
          # produce lcov-format coverage.info using llvm-cov export (preferred)
          $coverageInfo = Join-Path (Get-Location) "coverage.info"
          Write-Host "Attempting to generate LCOV using 'llvm-cov export' -> $coverageInfo"
        
          # Try the preferred 'export' command (writes to stdout; redirect to file)
          & $llvmCovCmd export ("-instr-profile=$profdata") ("-format=lcov") $exePath > $coverageInfo
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $coverageInfo)) {
            Write-Warning "llvm-cov export failed (maybe older llvm). Falling back to 'llvm-cov show -format=text' (NOT true LCOV)."
            # remove possibly partial file
            if (Test-Path $coverageInfo) { Remove-Item $coverageInfo -Force }
            & $llvmCovCmd show $exePath ("-instr-profile=$profdata") ("-format=text") > $coverageInfo
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $coverageInfo)) {
              Write-Error "Both llvm-cov export and fallback show (text) failed. Inspect llvm-cov output above for details."
              # print a textual report for debugging
              & $llvmCovCmd report $exePath ("-instr-profile=$profdata") 2>&1 | ForEach-Object { Write-Host $_ }
              Exit 1
            } else {
              Write-Warning "Fallback produced a text-format coverage file at $coverageInfo (not LCOV). Consider installing a newer LLVM with 'llvm-cov export'."
            }
          } else {
            Write-Host "Generated LCOV-format coverage.info"
          }
        
          # Print short textual summary (always useful)
          & $llvmCovCmd report $exePath ("-instr-profile=$profdata") | ForEach-Object { Write-Host $_ }
        
          # Generate HTML using show (still correct)
          $htmlDir = Join-Path (Get-Location) "coverage_html"
          Write-Host "Generating HTML -> $htmlDir"
          & $llvmCovCmd show $exePath ("-instr-profile=$profdata") ("-format=html") ("-output-dir=$htmlDir")
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $htmlDir)) {
            Write-Error "llvm-cov html generation failed."
            Exit 1
          }
          Write-Host "HTML coverage generated at $htmlDir"

      
      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DX12-Coverage-Report
          path: build/coverage_html
      
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/coverage.info
          flags: dx12
          fail_ci_if_error: true
      