name: macOS Build (AppleClang x86 & ARM)
permissions:
  contents: read
  
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
        build_type: [Release]

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive      
      - name: Prepare Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
            vulkan-query-version: latest
            vulkan-components: Vulkan-Headers, Vulkan-Loader
            vulkan-use-cache: true
      - name: Configure CMake (macOS)
        run: >
          cmake -B build
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DPYRO_COMMON_BUILD_TESTS=OFF
          -DPYRO_COMMON_SHARED_LIBRARY=OFF
          -DPYRO_RHI_BUILD_VULKAN=ON
          -DPYRO_RHI_BUILD_VULKAN_VALIDATION_TESTS=OFF
          -DPYRO_RHI_BUILD_DX12=OFF
          -DPYRO_RHI_BUILD_METAL=ON
          -S .

      - name: Build (macOS)
        run: cmake --build build --config ${{ matrix.build_type }} --parallel 4
